name: Actualizar Catálogo Automáticamente

on:
  schedule:
    # Se ejecutará a las 00:00 (medianoche) cada 3 días
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Esto permite que sigas usándolo manualmente si quieres

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar herramientas
      run: |
        pip install playwright beautifulsoup4
        playwright install chromium

    - name: Ejecutar el Robot (Scraper)
      run: python scraper.py

    - name: Guardar los cambios (Commit y Push)
      run: |
        git config --global user.name "Robot del Catálogo"
        git config --global user.email "robot@tucatalogo.com"
        git add productos.json
        git commit -m "Actualización programada (cada 3 días)" || echo "No hay cambios nuevos"
        git pull origin main --rebase
        git push origin main
