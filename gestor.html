<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor Avanzado</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .filtro-lista-negra { background: #fee2e2; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ef4444; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.oculto { border: 2px solid #ef4444; background: #fff1f2; }
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; }
        .btn-save { background: #10b981; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-hide { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .btn-show { background: #3b82f6; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .panel-fijo { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #1e293b; color: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ Gestión de Catálogo y Lista Negra</h1>
        <p>Usa el buscador para editar o el botón rojo para mover a Lista Negra.</p>
    </div>

    <div class="filtro-lista-negra">
        <span><b>Herramienta de Control:</b> Visualiza solo los artículos que has ocultado del público.</span>
        <button onclick="verSoloOcultos()" style="padding:10px 20px; cursor:pointer; background:#ef4444; color:white; border:none; border-radius:5px; font-weight:bold;">Ver Lista Negra</button>
    </div>

    <div style="margin-bottom: 20px;">
        <input type="text" id="buscador" placeholder="Buscar por nombre para editar o restaurar..." onkeyup="dibujar()" style="padding:12px; width:100%; max-width:500px; border-radius:20px; border:1px solid #ccc;">
    </div>

    <div id="galeria" class="grid"></div>

    <div class="panel-fijo">
        <h4 id="cuenta">0 cambios pendientes</h4>
        <button onclick="copiar()" style="width:100%; padding:10px; background:#f59e0b; border:none; border-radius:5px; font-weight:bold; cursor:pointer">📋 Copiar para GitHub</button>
    </div>

    <script>
        let db = []; let cola = []; let modoOculto = false;
        async function cargar() {
            const r = await fetch('productos.json?v=' + Date.now());
            const data = await r.json();
            db = data.productos || [];
            dibujar();
        }

        function verSoloOcultos() {
            modoOculto = !modoOculto;
            document.getElementById('buscador').value = '';
            dibujar();
        }

        function dibujar() {
            const q = document.getElementById('buscador').value.toLowerCase();
            const g = document.getElementById('galeria'); g.innerHTML = '';
            
            let filtrados = db;
            if(modoOculto) {
                // Si alguien tiene visible: false o está marcado como oculto en la cola actual
                filtrados = db.filter(p => p.visible === false);
            } else {
                filtrados = db.filter(p => p.nombre.toLowerCase().includes(q));
            }

            filtrados.slice(0, 40).forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'card' + (p.visible === false ? ' oculto' : '');
                card.innerHTML = `
                    <small>Estado: ${p.visible === false ? '🚫 OCULTO' : '✅ VISIBLE'}</small>
                    <input type="text" id="n-${i}" value="${p.nombre}" readonly style="background:#eee">
                    <textarea id="d-${i}" placeholder="Detalles...">${p.detalles || ''}</textarea>
                    <input type="text" id="s-${i}" value="${p.sinonimos || ''}" placeholder="Sinónimos...">
                    <button class="btn-save" onclick="preparar(${i}, true)">✅ Guardar/Activar</button>
                    ${p.visible !== false ? `<button class="btn-hide" onclick="preparar(${i}, false)">🚫 Mover a Lista Negra</button>` : ''}
                `;
                g.appendChild(card);
            });
        }

        function preparar(idx, vis) {
            const nom = document.getElementById(`n-${idx}`).value;
            const original = db.find(x => x.nombre === nom);
            const item = {
                nombre: nom,
                detalles: document.getElementById(`d-${idx}`).value,
                sinonimos: document.getElementById(`s-${idx}`).value,
                visible: vis,
                imagen: original.imagen,
                categoria: original.categoria
            };
            cola = cola.filter(c => c.nombre !== nom); cola.push(item);
            document.getElementById('cuenta').innerText = cola.length + " cambios listos";
        }

        function copiar() {
            navigator.clipboard.writeText(JSON.stringify(cola));
            alert("Código copiado. Ve a Actions > Carga Masiva.");
        }
        cargar();
    </script>
</body>
</html>
