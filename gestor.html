<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor Avanzado Completo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        
        /* Panel Agregar Nuevo */
        .crear-panel { background: #e8f4f8; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #3498db; }
        .crear-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        /* Panel Lista Negra */
        .filtro-lista-negra { background: #fee2e2; padding: 15px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #ef4444; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card.oculto { border: 2px solid #ef4444; background: #fff1f2; }
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        textarea { height: 60px; resize: vertical; }
        .btn-new { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 15px; grid-column: 1 / -1;}
        .btn-save { background: #10b981; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-hide { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .panel-fijo { position: fixed; bottom: 20px; right: 20px; width: 300px; background: #1e293b; color: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 100; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛠️ Gestión Total de Catálogo</h1>
    </div>

    <div class="crear-panel">
        <h2 style="margin-top:0">➕ Agregar Producto Manual</h2>
        <div class="crear-grid">
            <div>
                <input type="text" id="nuevo-nombre" placeholder="Nombre completo (Ej: DAHUA - Cámara IP)">
                <select id="nuevo-categoria">
                    <option value="NOVEDADES">NOVEDADES</option>
                    <option value="Cámaras - Control Remoto - Energía - Cables - Soportes - Conectores">Cámaras - DIMAX</option>
                    <option value="VIDEOVIGILANCIA">VIDEOVIGILANCIA</option>
                    <option value="CONTROL DE ACCESO">CONTROL DE ACCESO</option>
                    <option value="ALARMAS Y DOMOTICA">ALARMAS Y DOMOTICA</option>
                    <option value="SISTEMAS ANTIHURTO">SISTEMAS ANTIHURTO</option>
                    <option value="REDES">REDES</option>
                    <option value="COMPUTO">COMPUTO</option>
                </select>
            </div>
            <div>
                <input type="text" id="nuevo-imagen" placeholder="URL de la Imagen">
                <input type="text" id="nuevo-video" placeholder="URL del Video (Opcional)">
            </div>
            <div style="grid-column: 1 / -1;">
                <input type="text" id="nuevo-sinonimos" placeholder="Sinónimos separados por coma (ej: dvr, disco, cable)">
                <textarea id="nuevo-detalles" placeholder="Detalles técnicos y especificaciones..."></textarea>
                <button class="btn-new" onclick="crearProductoManual()">➕ Añadir Producto a la Cola</button>
            </div>
        </div>
    </div>

    <div class="filtro-lista-negra">
        <span><b>Herramienta de Control:</b> Visualiza solo los artículos que has ocultado del público.</span>
        <button onclick="verSoloOcultos()" style="padding:10px 20px; cursor:pointer; background:#ef4444; color:white; border:none; border-radius:5px; font-weight:bold;">Ver Lista Negra</button>
    </div>

    <div style="margin-bottom: 20px;">
        <input type="text" id="buscador" placeholder="Buscar por nombre para editar o restaurar..." onkeyup="dibujar()" style="padding:12px; width:100%; font-size: 16px;">
    </div>

    <div id="galeria" class="grid"></div>

    <div class="panel-fijo">
        <h4 id="cuenta" style="margin-top:0;">0 cambios en cola</h4>
        <button onclick="copiar()" style="width:100%; padding:10px; background:#f59e0b; border:none; border-radius:5px; font-weight:bold; cursor:pointer">📋 Copiar para GitHub</button>
    </div>

    <script>
        let db = []; let cola = []; let modoOculto = false;
        async function cargar() {
            try {
                const r = await fetch('productos.json?v=' + Date.now());
                const data = await r.json();
                db = data.productos || [];
                dibujar();
            } catch (e) {
                document.getElementById('galeria').innerHTML = "<p>Cargando datos...</p>";
            }
        }

        function verSoloOcultos() {
            modoOculto = !modoOculto;
            document.getElementById('buscador').value = '';
            dibujar();
        }

        function dibujar() {
            const q = document.getElementById('buscador').value.toLowerCase();
            const g = document.getElementById('galeria'); g.innerHTML = '';
            
            let filtrados = db;
            if(modoOculto) {
                filtrados = db.filter(p => p.visible === false);
            } else {
                filtrados = db.filter(p => p.nombre.toLowerCase().includes(q));
            }

            // Muestra una cantidad limitada para no congelar el navegador
            let limite = q === '' && !modoOculto ? 20 : 50;

            filtrados.slice(0, limite).forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'card' + (p.visible === false ? ' oculto' : '');
                card.innerHTML = `
                    <small>Estado: ${p.visible === false ? '🚫 OCULTO' : '✅ VISIBLE'}</small>
                    <input type="text" id="n-${i}" value="${p.nombre}" readonly style="background:#eee">
                    <textarea id="d-${i}" placeholder="Detalles técnicos...">${p.detalles || ''}</textarea>
                    <input type="text" id="s-${i}" value="${p.sinonimos || ''}" placeholder="Sinónimos (ej: dvr, grabador)">
                    <input type="text" id="v-${i}" value="${p.video || ''}" placeholder="URL del Video (YouTube)">
                    <button class="btn-save" onclick="preparar(${i}, true)">✅ Guardar/Activar</button>
                    ${p.visible !== false ? \`<button class="btn-hide" onclick="preparar(${i}, false)">🚫 Mover a Lista Negra</button>\` : ''}
                `;
                g.appendChild(card);
            });
        }

        function preparar(idx, vis) {
            const nom = document.getElementById(\`n-\${idx}\`).value;
            const original = db.find(x => x.nombre === nom);
            const item = {
                nombre: nom,
                detalles: document.getElementById(\`d-\${idx}\`).value,
                sinonimos: document.getElementById(\`s-\${idx}\`).value,
                video: document.getElementById(\`v-\${idx}\`).value,
                visible: vis,
                imagen: original.imagen,
                categoria: original.categoria
            };
            agregarACola(item);
        }

        function crearProductoManual() {
            const nom = document.getElementById('nuevo-nombre').value.trim();
            const img = document.getElementById('nuevo-imagen').value.trim();
            
            if(!nom || !img) { 
                alert("⚠️ Nombre y URL de la Imagen son obligatorios."); 
                return; 
            }

            const item = {
                nombre: nom,
                categoria: document.getElementById('nuevo-categoria').value,
                imagen: img,
                video: document.getElementById('nuevo-video').value.trim(),
                sinonimos: document.getElementById('nuevo-sinonimos').value.trim(),
                detalles: document.getElementById('nuevo-detalles').value.trim(),
                visible: true
            };
            
            agregarACola(item);
            
            // Limpiar campos para agregar más
            document.getElementById('nuevo-nombre').value = '';
            document.getElementById('nuevo-imagen').value = '';
            document.getElementById('nuevo-video').value = '';
            document.getElementById('nuevo-sinonimos').value = '';
            document.getElementById('nuevo-detalles').value = '';
            alert("✅ ¡Producto añadido a la cola!");
        }

        function agregarACola(item) {
            cola = cola.filter(c => c.nombre !== item.nombre);
            cola.push(item);
            document.getElementById('cuenta').innerText = cola.length + " cambios en cola";
        }

        function copiar() {
            if(cola.length === 0) return alert("No hay cambios para guardar.");
            navigator.clipboard.writeText(JSON.stringify(cola));
            alert("¡Código copiado! Ve a GitHub > Actions > Ejecuta la Carga Masiva y pega el código.");
        }
        cargar();
    </script>
</body>
</html>
